<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16150f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Beschwerde">
<meta name="description" content="Конструктор ответа на жалобу — Deutsch-Test für den Beruf B2">
<title>Kartei Beschwerde v3 — картотека и дрилл</title>
<style>
:root{
  --bg:#faf9f7; --fg:#1c1a17; --muted:#6b6459; --faint:#8d8578; --line:#e2ddd4; --card:#fff;
  --acc:#1d4ed8; --acc-bg:#e8eeff;
  --de:#1a1a1a; --ru:#6b6459;
  --slot:#b45309; --slot-bg:#fdf0dc;
  --ok:#15803d; --ok-bg:#e7f5ec;
  --no:#b91c1c; --no-bg:#fdeaea;
  --fix:#0f766e; --fix-bg:#e6f4f1;
  --opt:#a16207; --opt-bg:#fdf6e3;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#16150f; --fg:#eeeae2; --muted:#a49c8e; --faint:#8a8274; --line:#332f27; --card:#1e1c16;
  --acc:#93b4ff; --acc-bg:#152444;
  --de:#f0ece4; --ru:#a49c8e;
  --slot:#fbbf24; --slot-bg:#3a2c10;
  --ok:#6ee7a8; --ok-bg:#0f2e1d;
  --no:#fca5a5; --no-bg:#3a1717;
  --fix:#5eead4; --fix-bg:#123833;
  --opt:#fcd34d; --opt-bg:#332708;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:26px 18px 80px}
h1{font-size:24px;margin:0 0 3px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px;margin:0 0 20px}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:12px}
.tab{background:none;border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:8px;
  font:600 14px inherit;cursor:pointer}
.tab:hover{color:var(--fg)} .tab.on{background:var(--acc-bg);border-color:var(--acc);color:var(--acc)}

.ctrl{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--muted);padding:5px 12px;border-radius:18px;
  font:600 13px inherit;cursor:pointer}
.chip.on{background:var(--acc-bg);border-color:var(--acc);color:var(--acc)}
.lbl{font-size:13px;color:var(--faint)}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;
  border-left:4px solid var(--acc)}
.card.fix{border-left-color:var(--fix)}
.card.opt{border-left-color:var(--opt)}
.chead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.cid{font:800 12.5px inherit;letter-spacing:.04em;background:var(--acc-bg);color:var(--acc);padding:3px 9px;border-radius:5px}
.card.fix .cid{background:var(--fix-bg);color:var(--fix)}
.card.opt .cid{background:var(--opt-bg);color:var(--opt)}
.cde{font-weight:700;font-size:17px}
.cru{font-size:15px;color:var(--muted)}
.chf{font-size:12.5px;color:var(--faint);margin-left:auto}

.rahmen{background:var(--bg);border-radius:9px;padding:12px 14px;margin:10px 0}
.de{font-size:16.5px;line-height:1.55;color:var(--de);white-space:pre-wrap}
.ru{display:block;font-size:13.5px;line-height:1.45;color:var(--ru);margin-top:6px;white-space:pre-wrap}
.slotmark{background:var(--slot-bg);color:var(--slot);font-weight:700;padding:1px 5px;border-radius:4px}

ul.sl{margin:12px 0 0;padding:0;list-style:none}
ul.sl li{margin-bottom:11px;padding-left:12px;border-left:2px solid var(--slot-bg)}
ul.sl .d{font-size:15.5px;line-height:1.45;color:var(--de)}
ul.sl .r{display:block;font-size:13px;color:var(--ru);margin-top:3px}
ul.sl .n{display:block;font-size:11.5px;color:var(--faint);margin-top:3px}

.trap{font-size:13.5px;color:var(--muted);margin-top:13px;padding-top:11px;border-top:1px dashed var(--line)}
.trap b{color:var(--fg)}
.trapt{display:block;font:800 10.5px inherit;letter-spacing:.07em;text-transform:uppercase;color:var(--no);margin-bottom:4px}
.mark{display:inline-block;font:600 11.5px inherit;background:var(--opt-bg);color:var(--opt);
  padding:2px 8px;border-radius:4px;border:1px solid var(--opt);margin:7px 5px 0 0}

table{width:100%;border-collapse:collapse;font-size:14.5px;margin:10px 0}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 12px inherit;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
td.k{font-weight:700;color:var(--acc);white-space:nowrap}
td .r{display:block;font-size:12.5px;color:var(--ru);margin-top:2px}
.scroll{overflow-x:auto}

.drill{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;text-align:center}
.dq{font-size:19px;line-height:1.45;margin:14px 0 4px;color:var(--de)}
.dq.it{font-style:italic}
.dqru{color:var(--ru);font-size:14.5px;margin-bottom:18px}
.opts{display:grid;gap:9px;grid-template-columns:1fr;max-width:560px;margin:0 auto}
@media(min-width:560px){.opts{grid-template-columns:1fr 1fr}}
.opt{background:var(--bg);border:1px solid var(--line);color:var(--fg);padding:11px 13px;border-radius:9px;
  font:600 14.5px inherit;cursor:pointer;text-align:left}
.opt:hover{border-color:var(--acc)}
.opt.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--no-bg);border-color:var(--no);color:var(--no)}
.btn{background:var(--acc);color:#fff;border:0;padding:11px 22px;border-radius:9px;font:700 15px inherit;cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--muted)}
.score{font-size:13px;color:var(--muted);margin-top:15px}
.reveal{background:var(--bg);border-radius:10px;padding:15px;margin:16px auto 0;max-width:680px;text-align:left}
.hidden{display:none}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:18px}
.prog i{display:block;height:100%;background:var(--acc);transition:width .2s}

.cheat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.cheat h3{font:700 12.5px inherit;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.cheat h3:first-child{margin-top:0}
.crow{margin-bottom:13px}
.crow .rid{display:inline-block;font:800 11px inherit;color:var(--acc);min-width:34px;vertical-align:1px}
.chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px}
.chain span{font-weight:800;background:var(--acc-bg);color:var(--acc);padding:2px 7px;border-radius:4px}
.chain i{color:var(--faint);font-style:normal}
.note{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--opt);border-radius:10px;
  padding:14px 16px;margin-bottom:14px;font-size:14.5px;color:var(--muted)}
.note b{color:var(--fg)}

@media(max-width:560px){
  .wrap{padding:16px 12px 60px}
  h1{font-size:21px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:10px}
  .tab{white-space:nowrap;flex:0 0 auto;padding:7px 12px;font-size:13px}
  .card{padding:13px 14px}
  .de{font-size:16px} .drill{padding:16px}
  .dq{font-size:17px}
  .chead{gap:6px} .chf{margin-left:0;width:100%}
}
</style>
</head>
<body>
<div class="wrap">

<h1>Kartei Beschwerde <span style="color:var(--faint);font-weight:400">v3</span></h1>
<p class="sub">Конструктор ответа на жалобу · Deutsch-Test für den Beruf B2 · 13 блоков, покрытие 56 заданий из 56 · к каждой немецкой фразе дан перевод</p>

<div class="tabs">
  <button class="tab on" data-t="kartei">Картотека</button>
  <button class="tab" data-t="d1">Дрилл: шеф → блок</button>
  <button class="tab" data-t="d2">Дрилл: рус → нем</button>
  <button class="tab" data-t="d3">Дрилл: причины</button>
  <button class="tab" data-t="cheat">Шпаргалка</button>
  <button class="tab" data-t="info">Правила и критерии</button>
</div>

<section id="kartei">
  <div class="ctrl"><span class="lbl">Показать:</span><span id="kindFilter"></span></div>
  <div class="ctrl"><span class="lbl">Блок:</span><span id="blkFilter"></span></div>
  <div id="cards"></div>
</section>

<section id="d1" class="hidden">
  <div class="prog"><i id="p1" style="width:0"></i></div>
  <div class="drill">
    <div style="font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">Записка шефа требует…</div>
    <div class="dq it" id="d1q"></div>
    <div class="dqru" id="d1ru"></div>
    <div class="opts" id="d1opts"></div>
    <div class="score" id="d1sc"></div>
    <div style="margin-top:14px"><button class="btn ghost" id="d1reset">Начать заново</button></div>
  </div>
</section>

<section id="d2" class="hidden">
  <div class="prog"><i id="p2" style="width:0"></i></div>
  <div class="drill">
    <div style="font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)" id="d2tag"></div>
    <div class="dq" id="d2q"></div>
    <div id="d2rev" class="reveal hidden"></div>
    <div style="margin-top:16px;display:flex;gap:9px;justify-content:center;flex-wrap:wrap">
      <button class="btn" id="d2show">Показать немецкий</button>
      <button class="btn ghost" id="d2next">Дальше →</button>
    </div>
    <div class="score" id="d2sc"></div>
  </div>
</section>

<section id="d3" class="hidden">
  <div class="drill">
    <div style="font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">Скажи по-немецки в Genitiv — после «aufgrund»</div>
    <div class="dq" id="d3q"></div>
    <div class="dqru" id="d3deckt"></div>
    <div id="d3rev" class="reveal hidden"></div>
    <div style="margin-top:16px;display:flex;gap:9px;justify-content:center;flex-wrap:wrap">
      <button class="btn" id="d3show">Показать</button>
      <button class="btn ghost" id="d3next">Дальше →</button>
    </div>
  </div>
</section>

<section id="cheat" class="hidden"><div class="cheat" id="cheatBody"></div></section>
<section id="info" class="hidden"><div id="infoBody"></div></section>

</div>

<script src="beschwerde_data.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const slots = s => esc(s).replace(/\[([^\]]+)\]/g,'<span class="slotmark">$1</span>');
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);

const SECS=['kartei','d1','d2','d3','cheat','info'];
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  SECS.forEach(s=>$('#'+s).classList.toggle('hidden', s!==b.dataset.t));
});

/* ---------- КАРТОТЕКА ---------- */
let kindSel='alle', blkSel='ALL';
const KINDS=[['alle','всё'],['kern','ядро — 13'],['fix','фикс. добавки — 2'],['opt','необязательные — 3']];

function buildFilters(){
  $('#kindFilter').innerHTML = KINDS.map(([k,n])=>
    `<button class="chip ${k===kindSel?'on':''}" data-k="${k}">${n}</button>`).join(' ');
  $('#kindFilter').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{kindSel=c.dataset.k;blkSel='ALL';buildFilters();render();});

  const list = BLOECKE.filter(b=>kindSel==='alle'||b.kind===kindSel);
  $('#blkFilter').innerHTML = `<button class="chip ${blkSel==='ALL'?'on':''}" data-b="ALL">все</button> ` +
    list.map(b=>`<button class="chip ${b.id===blkSel?'on':''}" data-b="${b.id}">${b.id}</button>`).join(' ');
  $('#blkFilter').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{blkSel=c.dataset.b;buildFilters();render();});
}

function ursachenHtml(kasus){
  let h = '<ul class="sl">';
  URSACHEN.forEach(u=>{
    h += `<li><span class="d"><b>${u.n}.</b> ${esc(kasus==='akk'?u.akk:u.gen)}${u.endung?` <span class="slotmark">${u.endung}</span>`:''}</span>
      <span class="r">${esc(kasus==='akk'?u.ru_akk:u.ru)}</span>
      <span class="n">покрывает: ${esc(u.deckt)} · сработала ${esc(u.haeuf)}</span>`;
    if(u.variante) h += `<span class="n">вариант: ${esc(u.variante.de)} — ${esc(u.variante.ru)}</span>`;
    h += `</li>`;
  });
  h += '</ul>';
  h += `<div class="trap"><b>Тот же Genitiv требуют:</b><br>` +
       GEN_PRAEP.map(p=>`${esc(p.de)} <span style="color:var(--ru)">— ${esc(p.ru)}</span>`).join(' · ') + `</div>`;
  return h;
}

function render(){
  const list = BLOECKE.filter(b=>(kindSel==='alle'||b.kind===kindSel) && (blkSel==='ALL'||b.id===blkSel));
  $('#cards').innerHTML = list.map(b=>{
    let h = `<div class="card ${b.kind==='fix'?'fix':b.kind==='opt'?'opt':''}">
      <div class="chead"><span class="cid">${b.id}</span>
        <span class="cde">${esc(b.de)}</span><span class="cru">${esc(b.ru)}</span>
        <span class="chf">${esc(b.haeuf||'')}</span></div>
      <div class="rahmen"><div class="de">${slots(b.rahmen.de)}<span class="ru">${slots(b.rahmen.ru)}</span></div></div>`;
    if(b.ursachen) h += ursachenHtml(b.ursachen_kasus||'gen');
    if(b.slots && b.slots.length){
      h += '<ul class="sl">' + b.slots.map(s=>
        `<li><span class="d">${slots(s.de)}</span><span class="r">${slots(s.ru)}</span>` +
        (s.note?`<span class="n">${esc(s.note)}</span>`:'') + `</li>`).join('') + '</ul>';
    }
    if(b.falle) h += `<div class="trap"><span class="trapt">Ловушка</span>${esc(b.falle)}</div>`;
    if(b.c1 && b.c1.length) h += `<div>${b.c1.map(m=>`<span class="mark">${esc(m)}</span>`).join('')}</div>`;
    return h+'</div>';
  }).join('');
}

/* ---------- ДРИЛЛ 1: шеф → блок ---------- */
let q1=[],i1=0,ok1=0;
const ALLBLK = Object.keys(BLK_NAMEN);
function start1(){ q1=shuffle(TRIGGER.slice()); i1=0; ok1=0; next1(); }
function next1(){
  if(i1>=q1.length){ $('#d1q').textContent='Готово!'; $('#d1ru').textContent=`Правильно: ${ok1} из ${q1.length}`;
    $('#d1opts').innerHTML=''; $('#p1').style.width='100%'; return; }
  const t=q1[i1];
  $('#d1q').textContent='„'+t.de+'"';
  $('#d1ru').textContent=t.ru;
  const wrong = shuffle(ALLBLK.filter(f=>f!==t.blk)).slice(0,3);
  $('#d1opts').innerHTML = shuffle([t.blk,...wrong]).map(f=>
    `<button class="opt" data-f="${f}">${esc(BLK_NAMEN[f])}</button>`).join('');
  $('#d1opts').querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>{
    const good = btn.dataset.f===t.blk; if(good) ok1++;
    $('#d1opts').querySelectorAll('.opt').forEach(x=>{
      if(x.dataset.f===t.blk) x.classList.add('right');
      else if(x===btn) x.classList.add('wrong');
      x.onclick=null;
    });
    setTimeout(()=>{i1++;next1();}, good?550:1600);
  });
  $('#d1sc').textContent = `${i1+1} / ${q1.length} · правильно ${ok1}`;
  $('#p1').style.width = (i1/q1.length*100)+'%';
}
$('#d1reset').onclick = start1;

/* ---------- ДРИЛЛ 2: русский → немецкий ---------- */
let q2=[],i2=0;
function pool2(){
  const p=[];
  BLOECKE.forEach(b=>{
    p.push({tag:`${b.id} · ${b.ru}`, ru:b.rahmen.ru, de:b.rahmen.de});
    (b.slots||[]).forEach(s=>p.push({tag:`${b.id} · слот`, ru:s.ru, de:s.de}));
  });
  URSACHEN.forEach(u=>p.push({tag:'Причина · Genitiv', ru:u.ru, de:u.gen}));
  return p;
}
function start2(){ q2=shuffle(pool2()); i2=0; show2(); }
function show2(){
  if(i2>=q2.length) i2=0;
  const c=q2[i2];
  $('#d2tag').textContent=c.tag;
  $('#d2q').textContent=c.ru;
  $('#d2rev').classList.add('hidden');
  $('#d2rev').innerHTML=`<div class="de">${slots(c.de)}</div>`;
  $('#d2sc').textContent=`${i2+1} / ${q2.length}`;
  $('#p2').style.width=(i2/q2.length*100)+'%';
}
$('#d2show').onclick=()=>$('#d2rev').classList.remove('hidden');
$('#d2next').onclick=()=>{i2++;show2();};

/* ---------- ДРИЛЛ 3: причины ---------- */
let q3=[],i3=0;
function start3(){ q3=shuffle(URSACHEN.slice()); i3=0; show3(); }
function show3(){
  if(i3>=q3.length) i3=0;
  const u=q3[i3];
  $('#d3q').textContent=u.ru;
  $('#d3deckt').textContent='покрывает: '+u.deckt;
  $('#d3rev').classList.add('hidden');
  $('#d3rev').innerHTML =
    `<div class="de">aufgrund ${esc(u.gen)}${u.endung?` <span class="slotmark">окончание ${u.endung}</span>`:''}
      <span class="ru">Genitiv — после aufgrund / infolge / angesichts</span></div>
     <div class="de" style="margin-top:12px">auf ${esc(u.akk)}
      <span class="ru">Akkusativ — после «ist auf … zurückzuführen»</span></div>`;
}
$('#d3show').onclick=()=>$('#d3rev').classList.remove('hidden');
$('#d3next').onclick=()=>{i3++;show3();};

/* ---------- ШПАРГАЛКА ---------- */
function renderCheat(){
  const byId = Object.fromEntries(BLOECKE.map(b=>[b.id,b]));
  let h='<h3>Порядок сборки</h3><div class="chain">';
  REIHENFOLGE.forEach((id,i)=>{ h+=`<span>${id}</span>`; if(i<REIHENFOLGE.length-1) h+='<i>→</i>'; });
  h+='</div>';

  h+='<h3>Ядро — 13 каркасов</h3>';
  BLOECKE.filter(b=>b.kind==='kern').sort((a,b)=>a.pos-b.pos).forEach(b=>{
    h+=`<div class="crow"><span class="rid">${b.id}</span><span class="de">${slots(b.rahmen.de)}<span class="ru">${slots(b.rahmen.ru)}</span></span></div>`;
  });

  h+='<h3>Фиксированные добавки — 2</h3>';
  BLOECKE.filter(b=>b.kind==='fix').forEach(b=>{
    h+=`<div class="crow"><span class="rid">${b.id}</span><span class="de">${slots(b.rahmen.de)}<span class="ru">${slots(b.rahmen.ru)}</span></span></div>`;
  });

  h+='<h3>Необязательные — 3</h3>';
  BLOECKE.filter(b=>b.kind==='opt').forEach(b=>{
    h+=`<div class="crow"><span class="rid">${b.id}</span><span class="de">${slots(b.rahmen.de)}<span class="ru">${slots(b.rahmen.ru)}</span></span></div>`;
  });

  h+='<h3>Семь причин — Genitiv</h3>';
  URSACHEN.forEach(u=>{
    h+=`<div class="crow"><span class="rid">${u.n}.</span><span class="de">aufgrund ${esc(u.gen)}<span class="ru">${esc(u.ru)}</span></span></div>`;
  });
  h+=`<div class="crow" style="color:var(--muted);font-size:13.5px">Тот же Genitiv: ` +
     GEN_PRAEP.map(p=>`${esc(p.de)} (${esc(p.ru)})`).join(' · ') + `</div>`;
  $('#cheatBody').innerHTML=h;
}

/* ---------- ПРАВИЛА И КРИТЕРИИ ---------- */
function renderInfo(){
  let h='<div class="card" style="border-left-color:var(--opt)"><div class="chead"><span class="cde">Четыре критерия оценки</span></div><div class="scroll"><table>';
  h+='<tr><th>Официальное название</th><th>Что оценивается</th></tr>';
  KRITERIEN.forEach(k=>{
    h+=`<tr><td class="k">${esc(k.de)}<span class="r">${esc(k.ru)}</span></td><td>${esc(k.text)}</td></tr>`;
  });
  h+='</table></div></div>';

  REGELN.forEach((r,i)=>{
    h+=`<div class="card"><div class="chead"><span class="cid">Правило ${i+1}</span><span class="cde">${esc(r.titel)}</span></div>
      <div style="font-size:14.5px;color:var(--muted);margin-bottom:10px">${esc(r.text)}</div>
      <div class="rahmen"><div class="de">${esc(r.de)}<span class="ru">${esc(r.ru)}</span></div></div></div>`;
  });
  $('#infoBody').innerHTML=h;
}

buildFilters(); render(); start1(); start2(); start3(); renderCheat(); renderInfo();
</script>
